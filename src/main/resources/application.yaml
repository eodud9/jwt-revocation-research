spring:
  application:
    name: jwt-revocation-research

  datasource:
    url: jdbc:mysql://localhost:3307/jwt_research
    username: root
    password: ${MYSQL_ROOT_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6380

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000