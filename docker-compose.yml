services:
  mysql:
    image: mysql:8.4
    container_name: jwt-research-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7.4
    container_name: jwt-research-redis
    ports:
      - "6380:6379"

volumes:
  mysql-data:

